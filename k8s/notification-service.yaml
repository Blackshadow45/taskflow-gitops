apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: taskflow
  labels:
    app: notification-service
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: backend
    spec:
      terminationGracePeriodSeconds: 30
        imagePullSecrets:
        - name: ghcr-creds
          - name: ghcr-creds
      containers:
      - name: notification-service
        image: ghcr.io/blackshadow45/taskflow-platform/notification-service:1b01dc5be0aa4ad6fdb4aa5e4d721622b40e4d92
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5003
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /health
            port: 5003
          periodSeconds: 3
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /health
            port: 5003
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5003
          periodSeconds: 5
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: taskflow
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - name: http
    port: 5003
    targetPort: 5003
